name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: ESLint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: tsc --noEmit
        run: bunx tsc --noEmit

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      # Deterministic test secrets — no external services are contacted.
      AUTH_SECRET: ci_test_auth_secret
      REALTIME_SECRET: ci_test_realtime_secret
      STRIPE_WEBHOOK_SECRET: whsec_ci_test_secret
      NEXT_PUBLIC_APP_NAME: Meridian Market
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Unit + integration tests (real SQLite via Prisma)
        # vitest.config.ts provisions a throwaway SQLite DB from the real
        # schema; no API keys, no Stripe, no z.ai access required.
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Next.js build (standalone)
        env:
          # Dummy values only — the build must not depend on real secrets.
          DATABASE_URL: "file:/tmp/ci-build.db"
          AUTH_SECRET: "ci_dummy_auth_secret"
          REALTIME_SECRET: "ci_dummy_realtime_secret"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_dummy"
          NEXT_PUBLIC_APP_NAME: "Meridian Market"
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build
